}

// Patch cerrarModal para restaurar imagen si es necesario
(function(){
  const oldCerrar = window.cerrarModal;
  window.cerrarModal = function(){
    const modalImg = document.getElementById('modalImg');
    if(modalImg){ modalImg.style.display = 'block'; modalImg.src=''; }
    // restaurar todos los elementos genericos para el proximo modal
    const els = ['modalBarrio','modalTitulo','modalDesc','modalPrecio','modalWsp','modalIG','modalMap'];
    els.forEach(id=>{
      const el = document.getElementById(id);
      if(!el) return;
      if(id==='modalBarrio' || id==='modalPrecio') el.style.display='inline-block';
      else if(id==='modalWsp' || id==='modalIG' || id==='modalMap') el.style.display='flex';
      else el.style.display='block';
    });
    // reset contenido generico
    document.getElementById('modalBarrio').innerText='';
    document.getElementById('modalTitulo').innerText='';
    document.getElementById('modalDesc').innerHTML='';
    if(oldCerrar) oldCerrar();
    else document.getElementById('modalAviso').classList.remove('activo');
  };
})();

// Buscador igual que vidriera pero para PROFESIONALES
(function(){
  const input=document.getElementById('buscadorUnificado');
  const resultados=document.getElementById('resultadosUnificados');
  function normalizar(s){return (s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim();}
  if(!input || !resultados) return;
  input.addEventListener('input',(e)=>{
    const q=normalizar(e.target.value);
    if(q.length<2){
      resultados.style.display='none';
      resultados.innerHTML='';
      document.querySelectorAll('.grid .card-emp').forEach(c=>c.classList.remove('oculto'));
      return;
    }
    const filtrados = PROFESIONALES.filter(em=>normalizar(em.keywords).includes(q));
    if(filtrados.length===0){
      resultados.innerHTML='<div style="padding:14px;text-align:center;color:#64748b;font-weight:700">Sin resultados para "'+e.target.value+'"</div>';
      resultados.style.display='block';
      return;
    }
    resultados.innerHTML=filtrados.map((em, idx)=>`<div data-idx="${idx}" class="resultado-item" style="padding:12px 14px;border-bottom:1px solid #e2e8f0;cursor:pointer;display:flex;justify-content:space-between;align-items:center"><div><b style="font-size:13px">${em.nombre}</b><br><small style="color:#64748b">${(em.barrio||'').toUpperCase()} • ${em.cat||''}</small></div><span style="font-size:14px">↗️</span></div>`).join('');
    resultados.style.display='block';
    resultados.querySelectorAll('.resultado-item').forEach((div, i)=>{
      div.addEventListener('click',()=>{
        const em = filtrados[i];
        resultados.style.display='none';
        input.value='';
        // abrir modal correspondiente
        if(em.plantilla==='julia'){ abrirModalJulia(); } 
        else if(em.plantilla==='arcoiris'){ abrirModalArcoiris(); }
        else if(em.plantilla==='podologia'){ abrirModalPodologia(); }
        else if(em.plantilla==='eneagrama'){ abrirModalEneagrama(); }
        else { abrirModalDesdeObjeto(em); }
      });
    });
  });
  document.addEventListener('click',(ev)=>{
    if(!ev.target.closest('.buscador-wrap')){
      resultados.style.display='none';
    }
  });
})();
