  const isAmapola = o.negocio.includes('AMAPOLA');
  const colorMain = isAmapola ? '#be185d' : '#a21caf';
  const colorDark = '#831843';
  const colorLight = isAmapola ? '#fce7f3' : '#fdf4ff';
  const grad = isAmapola ? 'linear-gradient(135deg,#be185d,#ec4899)' : 'linear-gradient(135deg,#a21caf,#ec4899)';
  const icon = isAmapola ? '🌸' : '💊';
  
  if(o.foto_web){
    return `<div class="card-oferta" data-tipo="${o.tipo}" onclick="abrirModal('${o.id}')" style="border:2.5px solid ${colorMain};">

let ofertaActual = null;

function abrirModal(id){
  const o=OFERTAS.find(x=>x.id===id); if(!o) return;
  ofertaActual = o;
  const img=document.getElementById('modalImg');
  if(o.foto_web){ img.src=o.foto_web; img.style.display='block'; } else { img.style.display='none'; }
  document.getElementById('modalBarrio').innerText=o.barrio;
  document.getElementById('modalTitulo').innerText=o.nombre;
  document.getElementById('modalDesc').innerHTML=`<b>${o.negocio}</b><br><br>${o.desc}<br><br><small>${o.vigencia}</small>`;
  document.getElementById('farmaciaDesdePrincipal').style.display='none';
  document.getElementById('farmaciaDesdePrincipal').innerHTML='';
  document.getElementById('linkIrPrincipal').style.display='none';
  const btn=document.getElementById('modalPrincipal');
  btn.style.display='flex';
  if(o.comercio==='amapola'){
    btn.innerText='Ver aviso de AMAPOLA →';
    btn.style.background='linear-gradient(135deg,#be185d,#ec4899)';
  } else {
    btn.innerText='Ver aviso de FARMACIA VARA →';
    btn.style.background='linear-gradient(135deg,#a21caf,#ec4899)';
  }
  btn.disabled=false;
  document.getElementById('modalAviso').classList.add('activo');
}

async function cargarFarmaciaDesdePrincipal(){
  const o = ofertaActual;
  if(!o) return;
  const btn=document.getElementById('modalPrincipal');
  const cont=document.getElementById('farmaciaDesdePrincipal');
  const linkIr=document.getElementById('linkIrPrincipal');
  btn.innerText='Cargando aviso original...';
  btn.disabled=true;
  try{
    let htmlText=null;
    const paginas = ['comercios.html','./comercios.html','index.html','./index.html'];
    
    for(const r of paginas){
      try{
        const res=await fetch(r+'?v='+Date.now());
        if(res.ok){ 
          const t=await res.text();
          htmlText=t;
          if(t.toLowerCase().includes('card-'+o.comercio)) break;
        }
      }catch(e){}
    }
    if(!htmlText) throw new Error('no se pudo fetch');
    const parser=new DOMParser();
    const doc=parser.parseFromString(htmlText,'text/html');
    
    let originalCard=null;
    if(o.comercio==='amapola'){
      originalCard = doc.getElementById('card-amapola');
    } else {
      originalCard = doc.getElementById('card-vara') || doc.querySelector('#card-vara') || doc.getElementById('modal-farmacia');
    }
    
    if(!originalCard) throw new Error('aviso '+o.comercio+' no encontrado');
    
    let clonHTML = originalCard.outerHTML;
    clonHTML = clonHTML.replace(/onclick="abrirModalComercio[^"]*"/g, '').replace(/cursor:\s*pointer;?/g, '');
    
    cont.innerHTML='<div style="background:white;border-radius:16px;overflow:hidden;">'+clonHTML+'</div>';
    cont.style.display='block';
    btn.style.display='none';
    linkIr.style.display='block';
    linkIr.href= o.comercio==='amapola' ? 'comercios.html#amapola' : 'comercios.html#vara';
    linkIr.innerText = o.comercio==='amapola' ? 'Ir a comercios → AMAPOLA' : 'Ir a comercios → FARMACIA VARA';
    cont.scrollIntoView({behavior:'smooth',block:'start'});
  }catch(err){
    console.error(err);
    cont.innerHTML='<div style="padding:14px;background:#fef2f2;border-radius:12px;color:#991b1b;font-size:13px;">Error: '+err.message+'<br><br><a href="'+(o.comercio==='amapola' ? 'comercios.html' : 'comercios.html#vara')+'" style="color:#a21caf;font-weight:900">→ Ir directo</a></div>';
    cont.style.display='block';
    btn.style.display='none';
    linkIr.style.display='block';
  }
}

function cerrarModal(){document.getElementById('modalAviso').classList.remove('activo');}
</script>
